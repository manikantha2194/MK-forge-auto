<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradVid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120B08" />
      <stop offset="50%" stop-color="#180F0A" />
      <stop offset="100%" stop-color="#0A0604" />
    </linearGradient>
    <radialGradient id="glowVid" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF7A00" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FF7A00" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgGradVid)" />
  <circle cx="400" cy="230" r="220" fill="url(#glowVid)" />

  <!-- Video timeline & play icon -->
  <g transform="translate(400, 210)">
    <circle cx="0" cy="0" r="64" fill="#0F1014" stroke="#FF7A00" stroke-width="3" />
    <!-- Play Triangle -->
    <polygon points="-12,-24 24,0 -12,24" fill="#FF7A00" />
  </g>

  <!-- Timeline tracks below -->
  <g transform="translate(150, 310)">
    <rect width="500" height="40" rx="8" fill="#141720" stroke="rgba(255,122,0,0.2)" stroke-width="1" />
    <!-- Clips -->
    <rect x="15" y="8" width="120" height="24" rx="4" fill="#FF7A00" opacity="0.8" />
    <rect x="145" y="8" width="190" height="24" rx="4" fill="#E59500" opacity="0.8" />
    <rect x="345" y="8" width="140" height="24" rx="4" fill="#FF5500" opacity="0.8" />
    <!-- Playhead line -->
    <line x1="260" y1="-10" x2="260" y2="50" stroke="#FFFFFF" stroke-width="2" />
    <polygon points="255,-10 265,-10 260,-2" fill="#FFFFFF" />
  </g>

  <text x="400" y="420" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="28" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
    CINEMATIC VIDEO &amp; MOTION DESIGN
  </text>
  <text x="400" y="450" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="16" fill="#FF7A00" text-anchor="middle" letter-spacing="4">
    PREMIERE PRO • AFTER EFFECTS • COLOR GRADING
  </text>
</svg>
