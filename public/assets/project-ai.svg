<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradAI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0F14" />
      <stop offset="50%" stop-color="#141118" />
      <stop offset="100%" stop-color="#08080C" />
    </linearGradient>
    <radialGradient id="glowAI" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF7A00" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FF7A00" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgGradAI)" />
  <circle cx="400" cy="250" r="220" fill="url(#glowAI)" />
  
  <!-- Grid lines -->
  <g stroke="rgba(255,122,0,0.12)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="250" y1="0" x2="250" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="550" y1="0" x2="550" y2="500" />
    <line x1="700" y1="0" x2="700" y2="500" />
    <line x1="0" y1="125" x2="800" y2="125" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="375" x2="800" y2="375" />
  </g>

  <!-- Neural Net Nodes -->
  <g fill="#FF7A00">
    <circle cx="400" cy="250" r="16" />
    <circle cx="300" cy="180" r="10" />
    <circle cx="300" cy="320" r="10" />
    <circle cx="500" cy="180" r="10" />
    <circle cx="500" cy="320" r="10" />
    <circle cx="200" cy="250" r="8" />
    <circle cx="600" cy="250" r="8" />
  </g>
  <g stroke="#FF7A00" stroke-width="2" opacity="0.6">
    <line x1="200" y1="250" x2="300" y2="180" />
    <line x1="200" y1="250" x2="300" y2="320" />
    <line x1="300" y1="180" x2="400" y2="250" />
    <line x1="300" y1="320" x2="400" y2="250" />
    <line x1="400" y1="250" x2="500" y2="180" />
    <line x1="400" y1="250" x2="500" y2="320" />
    <line x1="500" y1="180" x2="600" y2="250" />
    <line x1="500" y1="320" x2="600" y2="250" />
  </g>

  <text x="400" y="420" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="28" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
    AI / ML INTELLIGENCE SYSTEM
  </text>
  <text x="400" y="450" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="16" fill="#FF7A00" text-anchor="middle" letter-spacing="4">
    NEURAL ARCHITECTURES &amp; MODELS
  </text>
</svg>
