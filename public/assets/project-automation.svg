<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradAuto" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0D08" />
      <stop offset="50%" stop-color="#14110A" />
      <stop offset="100%" stop-color="#070604" />
    </linearGradient>
    <radialGradient id="glowAuto" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF7A00" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FF7A00" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgGradAuto)" />
  <circle cx="400" cy="230" r="220" fill="url(#glowAuto)" />

  <!-- Gear & Workflow visual -->
  <g transform="translate(400, 220)">
    <circle cx="0" cy="0" r="70" fill="#151515" stroke="#FF7A00" stroke-width="4" />
    <circle cx="0" cy="0" r="35" fill="#FF7A00" />
    <!-- Gear teeth -->
    <rect x="-12" y="-90" width="24" height="24" rx="4" fill="#FF7A00" />
    <rect x="-12" y="66" width="24" height="24" rx="4" fill="#FF7A00" />
    <rect x="-90" y="-12" width="24" height="24" rx="4" fill="#FF7A00" />
    <rect x="66" y="-12" width="24" height="24" rx="4" fill="#FF7A00" />
    <rect x="-65" y="-65" width="22" height="22" rx="4" fill="#FF7A00" transform="rotate(45)" />
    <rect x="45" y="-65" width="22" height="22" rx="4" fill="#FF7A00" transform="rotate(45)" />
    <rect x="-65" y="45" width="22" height="22" rx="4" fill="#FF7A00" transform="rotate(45)" />
    <rect x="45" y="45" width="22" height="22" rx="4" fill="#FF7A00" transform="rotate(45)" />
  </g>

  <!-- Flow pipes -->
  <path d="M 120 220 L 290 220" stroke="#FF7A00" stroke-width="4" stroke-dasharray="8,6" />
  <path d="M 510 220 L 680 220" stroke="#FF7A00" stroke-width="4" stroke-dasharray="8,6" />

  <text x="400" y="420" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="28" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
    WORKFLOW &amp; AUTO PIPELINE
  </text>
  <text x="400" y="450" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="16" fill="#FF7A00" text-anchor="middle" letter-spacing="4">
    PYTHON • BOTS • CLOUD AUTOMATION
  </text>
</svg>
