<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <!-- Background aura / glow -->
    <radialGradient id="characterAura" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#FF7A00" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#FF5500" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#050505" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="hoodieGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#243048" />
      <stop offset="40%" stop-color="#1A2234" />
      <stop offset="100%" stop-color="#101622" />
    </linearGradient>
    <linearGradient id="hoodieShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151C2B" />
      <stop offset="100%" stop-color="#0B0E17" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2B78D" />
      <stop offset="60%" stop-color="#E29D6E" />
      <stop offset="100%" stop-color="#C57E52" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2320" />
      <stop offset="50%" stop-color="#1B1412" />
      <stop offset="100%" stop-color="#0D0A09" />
    </linearGradient>
    <linearGradient id="orangeRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9500" stop-opacity="0.9" />
      <stop offset="15%" stop-color="#FF7A00" stop-opacity="0.3" />
      <stop offset="85%" stop-color="#FF7A00" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FF9500" stop-opacity="0.9" />
    </linearGradient>
    <filter id="orangeGlowFx" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient background glow behind character -->
  <circle cx="300" cy="360" r="260" fill="url(#characterAura)" />

  <!-- Character Silhouette / Body -->
  <g id="character-body">
    <!-- Torso / Navy Blue Hoodie -->
    <path d="M 120 680 C 130 550, 180 470, 240 450 L 360 450 C 420 470, 470 550, 480 680 Z" fill="url(#hoodieGrad)" />
    
    <!-- Folded Arms / Forearms in front -->
    <path d="M 170 540 C 210 520, 390 520, 430 540 C 450 620, 410 650, 300 650 C 190 650, 150 620, 170 540 Z" fill="url(#hoodieShadow)" stroke="#2C3B57" stroke-width="2" />
    
    <!-- Crossed Forearms detail -->
    <path d="M 180 560 Q 300 630 420 560" stroke="#161E2E" stroke-width="12" fill="none" stroke-linecap="round" />
    <path d="M 220 580 Q 300 610 380 580" stroke="#25344F" stroke-width="6" fill="none" stroke-linecap="round" />

    <!-- Hoodie Kangaroo Pocket lines -->
    <path d="M 230 630 L 370 630" stroke="#161E2E" stroke-width="3" />

    <!-- "MK" printed on the chest -->
    <g transform="translate(370, 485) scale(0.65)" opacity="0.85">
      <text x="0" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="28" fill="#8898B5" letter-spacing="1">
        MK
      </text>
    </g>

    <!-- Hoodie Neck & Drawstrings -->
    <path d="M 240 450 Q 300 500 360 450" fill="url(#hoodieShadow)" stroke="#111622" stroke-width="4" />
    <!-- Drawstrings -->
    <path d="M 275 470 Q 272 520 270 540" stroke="#8898B5" stroke-width="3" stroke-linecap="round" />
    <circle cx="270" cy="542" r="3" fill="#B0C2DE" />
    <path d="M 325 470 Q 328 520 330 540" stroke="#8898B5" stroke-width="3" stroke-linecap="round" />
    <circle cx="330" cy="542" r="3" fill="#B0C2DE" />

    <!-- Neck -->
    <path d="M 265 400 L 265 460 Q 300 480 335 460 L 335 400 Z" fill="url(#skinGrad)" />
    <!-- Neck shadow -->
    <path d="M 265 400 Q 300 425 335 400 L 335 425 Q 300 445 265 425 Z" fill="#995E39" opacity="0.4" />

    <!-- Head / Face -->
    <path d="M 220 280 C 220 380, 240 415, 300 415 C 360 415, 380 380, 380 280 C 380 190, 360 180, 300 180 C 240 180, 220 190, 220 280 Z" fill="url(#skinGrad)" />

    <!-- Ears -->
    <path d="M 216 270 C 205 270, 205 310, 218 315 Z" fill="url(#skinGrad)" />
    <path d="M 384 270 C 395 270, 395 310, 382 315 Z" fill="url(#skinGrad)" />

    <!-- Beard and Mustache (Neat, well-groomed) -->
    <path d="M 222 300 C 226 390, 250 418, 300 418 C 350 418, 374 390, 378 300 C 374 340, 350 400, 300 400 C 250 400, 226 340, 222 300 Z" fill="url(#hairGrad)" />
    <!-- Mustache -->
    <path d="M 265 352 Q 300 346 335 352 Q 300 364 265 352 Z" fill="url(#hairGrad)" />
    <!-- Soul patch -->
    <path d="M 292 370 L 308 370 L 304 382 L 296 382 Z" fill="url(#hairGrad)" />

    <!-- Smile & Lips -->
    <path d="M 272 358 Q 300 376 328 358" stroke="#A75535" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M 278 360 Q 300 372 322 360" fill="#FFFFFF" opacity="0.9" />

    <!-- Nose -->
    <path d="M 295 295 Q 300 332 292 334 Q 300 338 308 334" stroke="#B8734A" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- Eyes and Eyebrows -->
    <!-- Left Eyebrow (Arching, confident) -->
    <path d="M 245 258 Q 268 246 288 255" stroke="url(#hairGrad)" stroke-width="6" fill="none" stroke-linecap="round" />
    <!-- Right Eyebrow -->
    <path d="M 312 255 Q 332 246 355 258" stroke="url(#hairGrad)" stroke-width="6" fill="none" stroke-linecap="round" />

    <!-- Left Eye -->
    <ellipse cx="268" cy="274" rx="14" ry="10" fill="#FFFFFF" />
    <circle cx="270" cy="274" r="7" fill="#3D261A" />
    <circle cx="272" cy="272" r="3" fill="#0D0704" />
    <circle cx="273" cy="270" r="2" fill="#FFFFFF" />

    <!-- Right Eye -->
    <ellipse cx="332" cy="274" rx="14" ry="10" fill="#FFFFFF" />
    <circle cx="330" cy="274" r="7" fill="#3D261A" />
    <circle cx="328" cy="272" r="3" fill="#0D0704" />
    <circle cx="327" cy="270" r="2" fill="#FFFFFF" />

    <!-- Cheerful eye creases -->
    <path d="M 252 282 Q 268 288 282 282" stroke="#C57E52" stroke-width="1.5" fill="none" />
    <path d="M 318 282 Q 332 288 348 282" stroke="#C57E52" stroke-width="1.5" fill="none" />

    <!-- Voluminous Stylish Curly Black Hair -->
    <g fill="url(#hairGrad)">
      <!-- Top curls and volume -->
      <circle cx="300" cy="155" r="50" />
      <circle cx="250" cy="165" r="48" />
      <circle cx="350" cy="165" r="48" />
      <circle cx="210" cy="195" r="44" />
      <circle cx="390" cy="195" r="44" />
      <circle cx="185" cy="245" r="38" />
      <circle cx="415" cy="245" r="38" />
      <circle cx="280" cy="140" r="36" />
      <circle cx="325" cy="140" r="36" />
      
      <!-- Front curls framing forehead -->
      <path d="M 200 230 C 215 190, 260 210, 280 225 C 295 210, 335 205, 360 220 C 385 205, 405 225, 400 250 C 375 230, 350 240, 340 250 C 310 240, 280 245, 260 255 C 240 245, 215 250, 200 230 Z" />
    </g>

    <!-- Orange Rim Highlights on hair and shoulders (cinematic lighting) -->
    <path d="M 125 670 C 135 555, 180 480, 240 455" stroke="#FF7A00" stroke-width="4" fill="none" opacity="0.8" filter="url(#orangeGlowFx)" />
    <path d="M 475 670 C 465 555, 420 480, 360 455" stroke="#FF7A00" stroke-width="4" fill="none" opacity="0.8" filter="url(#orangeGlowFx)" />
    <path d="M 180 235 Q 170 200 200 170 Q 240 135 290 130" stroke="#FF9500" stroke-width="3.5" fill="none" opacity="0.85" filter="url(#orangeGlowFx)" />
    <path d="M 420 235 Q 430 200 400 170 Q 360 135 310 130" stroke="#FF9500" stroke-width="3.5" fill="none" opacity="0.85" filter="url(#orangeGlowFx)" />
  </g>
</svg>
