<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="mkBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFBA00" />
      <stop offset="45%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#FF4000" />
    </linearGradient>
    <radialGradient id="mkGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFF3B0" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FF5500" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle rounded background -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#mkBgGrad)" filter="url(#shadow)" />
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#mkGlow)" />

  <!-- Orbiting Swoosh -->
  <path d="M 68 348 C 65 358, 85 365, 110 360 C 170 348, 230 310, 310 250 C 375 200, 420 148, 428 140 C 438 128, 420 120, 395 128 C 335 148, 240 215, 160 280 C 115 318, 72 340, 68 348 Z" fill="#0A0A0A" opacity="0.95" />
  
  <path d="M 75 355 C 130 345, 235 275, 340 190 C 390 150, 422 128, 430 135 C 435 140, 425 158, 385 198 C 290 288, 175 355, 95 365 C 80 367, 72 362, 75 355 Z" fill="#0A0A0A" />

  <!-- 4-Point Star at apex of orbit -->
  <path d="M 425 125 Q 425 105 429 88 Q 433 105 448 118 Q 433 125 429 142 Q 425 125 425 125 Z" fill="#0A0A0A" />
  <path d="M 408 114 Q 425 114 429 114 Q 429 114 448 114 Q 433 118 429 125 Q 425 118 408 114 Z" fill="#0A0A0A" />
  
  <!-- Stylized Monogram MK in solid deep black -->
  <g fill="#0A0A0A" filter="url(#shadow)">
    <!-- Letter M -->
    <path d="M 98 190 L 142 190 L 142 345 L 98 345 Z" />
    <path d="M 135 190 L 195 305 L 245 190 L 285 190 L 285 345 L 245 345 L 245 240 L 202 342 L 180 342 L 135 242 L 135 345 L 98 345 Z" />
    
    <!-- Letter K -->
    <path d="M 285 190 L 330 190 L 330 345 L 285 345 Z" />
    <path d="M 325 272 L 398 190 L 452 190 L 372 278 L 460 345 L 405 345 L 330 286 Z" />
  </g>
</svg>
